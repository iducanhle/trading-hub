<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Earnings Tracker</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Earnings dates, results and price reactions for the stocks you follow."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#faf9fd" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Earnings" />
    <link rel="icon" href="favicon.ico" sizes="32x32" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <script>
      // Applies the saved theme before Angular starts, so the page never flashes the wrong colours.
      // Same key and colours as ThemeService (src/app/core/services/theme.service.ts).
      (function () {
        try {
          var pref = localStorage.getItem('et.theme') || 'system';
          var dark =
            pref === 'dark' ||
            (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          if (dark) root.classList.add('dark');
          root.style.colorScheme = dark ? 'dark' : 'light';
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute('content', dark ? '#121316' : '#faf9fd');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
    <noscript>Earnings Tracker needs JavaScript.</noscript>
  </body>
</html>
